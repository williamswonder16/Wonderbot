<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WonderBot AI</title>

<style>
body{
font-family: Arial, sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
}

header{
background:#0f172a;
color:white;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

#chat{
height:70vh;
overflow-y:auto;
padding:15px;
}

.user{
background:#2563eb;
color:white;
padding:10px;
border-radius:10px;
margin:10px 0;
max-width:80%;
margin-left:auto;
}

.bot{
background:white;
padding:10px;
border-radius:10px;
margin:10px 0;
max-width:80%;
box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.input-area{
display:flex;
padding:10px;
background:white;
position:fixed;
bottom:0;
width:100%;
}

input{
flex:1;
padding:12px;
font-size:16px;
}

button{
padding:12px 20px;
background:#2563eb;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<header>WonderBot AI</header>

<div id="chat"></div>

<div class="input-area">
<input id="message" placeholder="Ask WonderBot anything...">
<button onclick="sendMessage()">Send</button>
</div>

<script>

const API_KEY = AQ.Ab8RN6Lu4_hgwHIy4_ZUIBzVCkhbJCPwWQVIfNBkzaLS2p3vhg;

async function sendMessage(){

const input=document.getElementById("message");
const text=input.value;

if(!text) return;

const chat=document.getElementById("chat");

chat.innerHTML += `<div class="user">${text}</div>`;

input.value="";

const response=await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{text:text}
]
}
]
})
}
);

const data=await response.json();

const reply=data.candidates[0].content.parts[0].text;

chat.innerHTML += `<div class="bot">${reply}</div>`;

chat.scrollTop=chat.scrollHeight;
}

</script>

</body>
</html>
